# Copy to the consumer repo root as `.actions.yml`
# Native iOS app: ios-ci + ios-publish.

schema_version: 2

versions:
  macos: "14"
  xcode: "16.2"
  ruby: "3.3.0"

testing:
  flutter:
    run_linter: false
    run_ios_tests: false
    run_android_tests: false
  ios:
    run_swiftlint: true
    run_tests: true
  android:
    run_unit_tests: false
    run_lint: false

publishing:
  flutter:
    deploy_ios: false
    deploy_android: false
  ios:
    enabled: true
    mode: build-and-publish
    target: testflight
  android:
    enabled: false
    mode: build-and-publish
    target: play_store

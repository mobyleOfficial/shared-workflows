name: Check AI Contribution

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-ai-contribution:
    name: Check for AI contribution attribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for AI attribution and commit ownership
        id: check
        run: |
          set +e

          pr_number="${{ github.event.pull_request.number }}"
          found=false
          violations=""

          append_violation() {
            local label="$1"
            local match="$2"
            found=true
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              violations="${violations}${violations:+$'\n'}[${label}] ${line}"
            done <<< "$match"
          }

          commits_json=$(gh api "repos/${{ github.repository }}/pulls/${pr_number}/commits" 2>/dev/null || echo "[]")

          # Matches Co-Authored-By / Made with / Generated with (e.g. "🤖 Generated with Claude Code")
          attribution_re='co-authored-by:|(made|generated)[[:space:]]+(with|by)'

          commits=$(echo "$commits_json" | jq -r '.[].commit.message')

          commit_hits=$(echo "$commits" | grep -iE "$attribution_re" || true)
          if [ -n "$commit_hits" ]; then
            append_violation "commit" "$commit_hits"
          fi

          # PR description (body) — same attribution footers
          body=$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" \
            --jq '.body // ""' 2>/dev/null || echo "")

          body_hits=$(echo "$body" | grep -iE "$attribution_re" || true)
          if [ -n "$body_hits" ]; then
            append_violation "pr body" "$body_hits"
          fi

          # Commit ownership — AI tools/bots must not be the author or committer of record
          ai_owner_re='claude|anthropic|chatgpt|gpt-[0-9]|openai|copilot|codex|devin|cursor(\[bot\])?|gemini|bard|jules|aider|sourcegraph|cody|amazon[- ]?q|codeium|tabnine|replit(-agent)?[[:space:]\[]|blackbox[- ]?ai'

          owner_lines=$(echo "$commits_json" | jq -r '.[] | "\(.sha[0:7]) author_login=\(.author.login // "null") author_name=\(.commit.author.name) author_email=\(.commit.author.email) committer_login=\(.committer.login // "null") committer_name=\(.commit.committer.name) committer_email=\(.commit.committer.email)"')

          owner_hits=$(echo "$owner_lines" | grep -iE "$ai_owner_re" || true)
          if [ -n "$owner_hits" ]; then
            append_violation "commit ownership" "$owner_hits"
          fi

          if [ "$found" = true ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            violations_encoded="${violations//$'\n'/'%0A'}"
            echo "violations=${violations_encoded}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Comment on PR if AI attribution or ownership found
        if: failure() && steps.check.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const violationsEncoded = '${{ steps.check.outputs.violations }}';

            if (!violationsEncoded) {
              console.warn('Warning: No violations output found');
              return;
            }

            const violations = violationsEncoded.replace(/%0A/g, '\n').trim();

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ AI ownership attribution detected\n\nPull requests must not claim AI co-authorship or tool ownership, and AI tools/bots must not be the author or committer of a commit. Found:\n\`\`\`\n${violations}\n\`\`\`\n\nPlease:\n- Amend commits to remove \`Co-Authored-By\` footers and lines like \`Generated with Claude Code\`, or open a new PR with a single author\n- Amend commits so the author/committer is a human account, not an AI tool or bot\n- Update the PR description to remove \`Co-Authored-By\` lines and any \`Made with …\` / \`Generated with …\` attribution`
            });

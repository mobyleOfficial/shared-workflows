name: iOS CI

on:
  workflow_call:
    inputs:
      macos-version:
        description: GitHub-hosted macOS image label (e.g. 14 or 15)
        required: false
        type: string
        default: '14'
      xcode-version:
        description: Xcode version for maxim-lobanov/setup-xcode
        required: false
        type: string
        default: '16.2'
      ruby-version:
        description: Ruby version for Bundler/Fastlane
        required: false
        type: string
        default: '3.3'
      run-swiftlint:
        description: Whether to run SwiftLint on ubuntu
        required: false
        type: boolean
        default: true
      swiftlint-image:
        description: Container image for SwiftLint
        required: false
        type: string
        default: 'ghcr.io/realm/swiftlint:0.59.1'
      run-tests:
        description: Whether to run the macOS test job
        required: false
        type: boolean
        default: true
      test-command:
        description: Shell command to run tests
        required: false
        type: string
        default: 'bundle exec fastlane test_project open:false'
      xcresult-path:
        description: Path to .xcresult bundle to upload/report
        required: false
        type: string
        default: 'TestResults.xcresult'
      working-directory:
        description: Working directory for Ruby/test commands
        required: false
        type: string
        default: '.'

permissions:
  contents: read
  checks: write

jobs:
  swiftlint:
    name: SwiftLint
    if: inputs.run-swiftlint
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.swiftlint-image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SwiftLint
        run: swiftlint --reporter github-actions-logging --strict

  test:
    name: Run tests
    needs: [swiftlint]
    if: always() && inputs.run-tests && (needs.swiftlint.result == 'success' || needs.swiftlint.result == 'skipped')
    permissions:
      checks: write
      contents: read
    runs-on: macos-${{ inputs.macos-version }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
          working-directory: ${{ inputs.working-directory }}

      - name: Run tests
        run: ${{ inputs.test-command }}

      - name: Zip test output
        if: success() || failure()
        run: |
          if [ -d "${{ inputs.xcresult-path }}" ] || [ -f "${{ inputs.xcresult-path }}" ]; then
            zip -r TestResults.zip "${{ inputs.xcresult-path }}"
          else
            echo "WARNING: xcresult path not found: ${{ inputs.xcresult-path }}"
          fi

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ inputs.working-directory }}/TestResults.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Test report
        if: success() || failure()
        continue-on-error: true
        uses: slidoapp/xcresulttool@v3.1.0
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.xcresult-path }}
          upload-bundles: never
          show-passed-tests: false
          show-code-coverage: true
          title: Test report
